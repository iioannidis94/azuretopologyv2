<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">    
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Azure Architecture Builder</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --azure-blue: #0078D4; --azure-light: #50E6FF; --azure-dark: #003A5C;
    --accent: #FFB900; --danger: #FF4444; --success: #00C851;
    --bg: #060D18; --bg2: #0A1628; --bg3: #0F1F3A;
    --border: rgba(0,120,212,0.3); --text: #E8F4FD; --muted: #7BA3C0;
    --card-bg: rgba(10,22,40,0.95);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: linear-gradient(rgba(0,120,212,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,120,212,0.04) 1px, transparent 1px); background-size: 40px 40px;
  }

  /* HEADER */
  header { position: relative; z-index: 10; padding: 16px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: rgba(6,13,24,0.9); backdrop-filter: blur(20px); }
  .logo { display: flex; align-items: center; gap: 14px; }
  .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--azure-blue), var(--azure-light)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 0 15px rgba(0,120,212,0.5); }
  .logo h1 { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; }
  .logo span { color: var(--azure-light); }
  .badge { font-size: 10px; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--success); color: var(--success); text-transform: uppercase; }

  /* LAYOUT */
  .app { position: relative; z-index: 1; display: grid; grid-template-columns: 360px 1fr 340px; height: calc(100vh - 69px); }
  .sidebar { border-right: 1px solid var(--border); overflow-y: auto; background: var(--card-bg); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .sidebar.right { border-right: none; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
  
  .section-title { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--azure-light); padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }

  /* DYNAMIC CARDS */
  .vnet-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 12px; position: relative; overflow: visible; }
  .vnet-header { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .vnet-row { display: flex; gap: 8px; align-items: center; }
  
  .input-field { background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 6px; border-radius: 4px; outline: none; width: 100%; transition: 0.2s; }
  .input-field:focus { border-color: var(--azure-light); background: rgba(0,120,212,0.1); }
  .input-field.cidr { width: 110px; text-align: center; color: var(--azure-light); }

  .resource-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 10px; padding: 4px 8px; border-radius: 4px; background: rgba(0,120,212,0.2); border: 1px solid var(--azure-blue); color: white; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
  .chip:hover { background: var(--azure-blue); }
  .chip.hub-chip { background: rgba(255,140,0,0.2); border-color: #FF8C00; }
  .chip.hub-chip:hover { background: #FF8C00; }

  /* BUTTONS & DROPDOWNS */
  .btn { background: transparent; border: 1px dashed var(--muted); color: var(--muted); padding: 6px 12px; font-size: 10px; cursor: pointer; border-radius: 4px; font-family: 'JetBrains Mono'; transition: 0.2s; text-align: center; width: 100%; margin-top: 8px; }
  .btn:hover { border-color: var(--azure-light); color: var(--azure-light); background: rgba(80,230,255,0.05); }
  .btn.primary { background: rgba(0,120,212,0.2); border: 1px solid var(--azure-blue); color: white; }
  .btn.primary:hover { background: var(--azure-blue); }
  .btn.danger { border-color: var(--danger); color: var(--danger); margin-top: 16px; }
  .btn.danger:hover { background: var(--danger); color: white; }

  .add-res-container { position: relative; }
  .res-dropdown { display: none; position: absolute; top: 100%; left: 0; width: 100%; background: var(--bg2); border: 1px solid var(--azure-blue); border-radius: 4px; z-index: 100; max-height: 200px; overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  .res-dropdown.show { display: block; }
  .res-option { padding: 8px; font-size: 10px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 8px; }
  .res-option:hover { background: var(--azure-blue); color: white; }

  /* EXPORT BTN */
  .export-btn { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; padding: 12px; border-radius: 8px; border: none; background: linear-gradient(135deg, var(--azure-blue), #00BCF2); color: white; cursor: pointer; width: 100%; transition: all 0.2s; text-transform: uppercase; }
  .export-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,120,212,0.4); }
  .export-btn.reset { background: transparent; border: 1px solid var(--danger); color: var(--danger); margin-bottom: 10px; }
  .export-btn.reset:hover { background: var(--danger); color: white; box-shadow: 0 8px 24px rgba(255,68,68,0.4); }

  /* CANVAS */
  .canvas-area { position: relative; overflow: hidden; background: var(--bg); }
  #diagram-canvas { width: 100%; height: 100%; cursor: grab; }
  #diagram-canvas:active { cursor: grabbing; }

  /* EDITOR (RIGHT SIDEBAR) */
  #editor-container { flex-grow: 1; }
  .editor-panel { background: var(--bg3); border: 1px solid var(--azure-blue); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .editor-header { display: flex; align-items: center; gap: 10px; font-family: 'Syne'; font-size: 16px; font-weight: 700; color: var(--azure-light); margin-bottom: 8px; }
  .editor-row { display: flex; flex-direction: column; gap: 4px; }
  .editor-label { font-size: 9px; color: var(--muted); text-transform: uppercase; }

  /* SCROLLBARS */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--azure-blue); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">⬡</div>
    <h1>Azure <span>Dynamic</span> Builder</h1>
  </div>
  <div class="badge">● Live Design Mode</div>
</header>

<div class="app">
  <div class="sidebar" id="sidebar-left">
    </div>

  <div class="canvas-area">
    <canvas id="diagram-canvas"></canvas>
  </div>

  <div class="sidebar right" id="sidebar-right">
    <div class="section-title">// Properties Editor</div>
    <div id="editor-container">
      <div style="text-align:center; color:var(--muted); font-size:11px; margin-top:20px;">
        ← Click a VNet or Resource to edit its configuration
      </div>
    </div>
    
    <div style="padding-top: 20px; margin-top: auto; border-top: 1px solid var(--border);">
      <button class="export-btn reset" onclick="resetDiagram()">🔄 Reset Diagram</button>
      <button class="export-btn" onclick="exportDiagram()">⬇ Export as PNG</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// RESOURCE DICTIONARY
// ============================================================
const RES_TYPES = {
  vm: { icon: '💻', color: '#00BCF2', label: 'Virtual Machine', config: { size: 'Standard_D2s_v3', os: 'Linux/Windows' } },
  sql: { icon: '🗄️', color: '#00B294', label: 'Azure SQL', config: { tier: 'General Purpose', vcores: '4' } },
  app: { icon: '🌐', color: '#00BCF2', label: 'App Service', config: { sku: 'Premium V3', instances: '2' } },
  kv: { icon: '🔑', color: '#FF8C00', label: 'Key Vault', config: { sku: 'Standard', rbac: 'Enabled' } },
  sa: { icon: '📦', color: '#00B294', label: 'Storage Account', config: { tier: 'Standard', replication: 'LRS' } },
  fa: { icon: '⚡', color: '#8764B8', label: 'Function App', config: { plan: 'Consumption', runtime: '.NET' } },
  aks: { icon: '☸️', color: '#0078D4', label: 'AKS Cluster', config: { nodes: '3', version: '1.27' } },
  fw: { icon: '🛡️', color: '#E81123', label: 'Azure Firewall', config: { sku: 'Premium', mode: 'Alert & Deny' } },
  nva: { icon: '🧱', color: '#E81123', label: 'FortiGate NVA', config: { mode: 'Active/Passive', version: '7.2' } },
  agw: { icon: '🌍', color: '#FF8C00', label: 'App Gateway', config: { sku: 'WAF_v2', capacity: 'Autoscale' } },
  lb: { icon: '⚖️', color: '#00BCF2', label: 'Load Balancer', config: { sku: 'Standard', type: 'Internal' } },
  gw: { icon: '🔀', color: '#0078D4', label: 'VPN Gateway', config: { sku: 'VpnGw2AZ', routing: 'BGP Enabled' } },
  bas: { icon: '🖥️', color: '#0078D4', label: 'Azure Bastion', config: { sku: 'Standard', tunneling: 'Enabled' } }
};

// ============================================================
// DYNAMIC STATE & LOCAL STORAGE
// ============================================================
const SAVED_STATE_KEY = 'azureBuilderState';

const defaultState = {
  hub: {
    id: 'hub', name: 'Hub VNet', cidr: '10.0.0.0/16', color: '#0078D4',
    resources: [
      { id: 'res-h1', type: 'fw', name: 'Hub Firewall', config: { ...RES_TYPES.fw.config } },
      { id: 'res-h2', type: 'gw', name: 'VPN Gateway', config: { ...RES_TYPES.gw.config } },
      { id: 'res-h3', type: 'bas', name: 'Bastion', config: { ...RES_TYPES.bas.config } }
    ]
  },
  spokes: [
    {
      id: 'spoke-1', name: 'Production', cidr: '10.1.0.0/16', color: '#00BCF2',
      resources: [
        { id: 'res-s1', type: 'vm', name: 'Prod VMs', config: { ...RES_TYPES.vm.config } },
        { id: 'res-s2', type: 'sql', name: 'Prod DB', config: { ...RES_TYPES.sql.config } }
      ]
    },
    {
      id: 'spoke-2', name: 'Dev / Test', cidr: '10.2.0.0/16', color: '#00B294',
      resources: [
        { id: 'res-s3', type: 'app', name: 'Dev API', config: { ...RES_TYPES.app.config } }
      ]
    }
  ],
  selectedId: null,
  offset: { x: 0, y: 0 }, scale: 1, dragging: false, dragStart: {x:0,y:0}, offsetStart: {x:0,y:0}
};

// Load state from localStorage or use default
let state;
const savedState = localStorage.getItem(SAVED_STATE_KEY);
if (savedState) {
  try {
    state = JSON.parse(savedState);
    // Reset temporary UI states that shouldn't persist exactly as they were
    state.dragging = false; 
  } catch (e) {
    console.error("Error parsing saved state, resetting to default.", e);
    state = JSON.parse(JSON.stringify(defaultState));
  }
} else {
  state = JSON.parse(JSON.stringify(defaultState));
}

const getUid = () => 'id-' + Math.random().toString(36).substr(2, 9);

// ============================================================
// UI RENDERING (LEFT SIDEBAR)
// ============================================================
function renderSidebar() {
  const container = document.getElementById('sidebar-left');
  let html = `<div class="section-title">// Hub Environment</div>`;
  
  html += buildVnetCard(state.hub, true);
  html += `<div class="section-title" style="margin-top:20px;">// Spoke Networks</div>`;
  
  state.spokes.forEach((spoke, idx) => {
    html += buildVnetCard(spoke, false, idx);
  });

  html += `<button class="btn primary" onclick="addSpoke()">➕ Add New Spoke</button>`;
  container.innerHTML = html;
}

function buildVnetCard(vnet, isHub, idx = null) {
  const isSelected = state.selectedId === vnet.id;
  let html = `
    <div class="vnet-card" style="border-color: ${isSelected ? 'var(--azure-light)' : 'var(--border)'}">
      <div class="vnet-header">
        <div class="vnet-row">
          <input type="text" class="input-field" value="${vnet.name}" onchange="updateVnet('${vnet.id}', 'name', this.value)" onclick="selectNode('${vnet.id}')">
          <input type="text" class="input-field cidr" value="${vnet.cidr}" onchange="updateVnet('${vnet.id}', 'cidr', this.value)" onclick="selectNode('${vnet.id}')">
        </div>
      </div>
      <div class="resource-chips">
  `;

  vnet.resources.forEach(res => {
    const rType = RES_TYPES[res.type] || RES_TYPES.vm; // Fallback in case of error
    const isResSelected = state.selectedId === res.id;
    html += `
      <div class="chip ${isHub ? 'hub-chip' : ''}" style="${isResSelected ? 'border-color:white; box-shadow:0 0 8px '+rType.color : ''}" onclick="selectNode('${res.id}')">
        ${rType.icon} ${res.name}
      </div>
    `;
  });

  html += `
      </div>
      <div class="add-res-container" style="margin-top:12px;">
        <button class="btn" onclick="toggleDropdown('${vnet.id}')">➕ Add Resource</button>
        <div class="res-dropdown" id="dropdown-${vnet.id}">
  `;
  
  Object.keys(RES_TYPES).forEach(key => {
    const t = RES_TYPES[key];
    html += `<div class="res-option" onclick="addResource('${vnet.id}', '${key}')">${t.icon} ${t.label}</div>`;
  });

  html += `</div></div></div>`;
  return html;
}

// ============================================================
// UI RENDERING (RIGHT EDITOR)
// ============================================================
function renderEditor() {
  const container = document.getElementById('editor-container');
  if (!state.selectedId) {
    container.innerHTML = `<div style="text-align:center; color:var(--muted); font-size:11px; margin-top:20px;">← Click a VNet or Resource to edit</div>`;
    return;
  }

  let selectedObj = null;
  let parentVnet = null;
  let isVnet = false;

  if (state.hub.id === state.selectedId) { selectedObj = state.hub; isVnet = true; }
  else {
    state.spokes.forEach(s => {
      if (s.id === state.selectedId) { selectedObj = s; isVnet = true; }
      const res = s.resources.find(r => r.id === state.selectedId);
      if (res) { selectedObj = res; parentVnet = s; }
    });
    const hubRes = state.hub.resources.find(r => r.id === state.selectedId);
    if (hubRes) { selectedObj = hubRes; parentVnet = state.hub; }
  }

  if (!selectedObj) {
    // Edge case if selectedId is invalid
    state.selectedId = null;
    return renderEditor();
  }

  let html = `<div class="editor-panel">`;
  
  if (isVnet) {
    html += `
      <div class="editor-header">🌐 ${selectedObj.name}</div>
      <div class="editor-row"><span class="editor-label">VNet Name</span><input type="text" class="input-field" value="${selectedObj.name}" onchange="updateVnet('${selectedObj.id}', 'name', this.value)"></div>
      <div class="editor-row"><span class="editor-label">CIDR Block</span><input type="text" class="input-field" value="${selectedObj.cidr}" onchange="updateVnet('${selectedObj.id}', 'cidr', this.value)"></div>
    `;
    if (selectedObj.id !== 'hub') {
      html += `<button class="btn danger" onclick="deleteSpoke('${selectedObj.id}')">🗑️ Delete Spoke</button>`;
    }
  } else {
    const rType = RES_TYPES[selectedObj.type] || RES_TYPES.vm;
    html += `
      <div class="editor-header">${rType.icon} ${rType.label}</div>
      <div class="editor-row"><span class="editor-label">Resource Name</span><input type="text" class="input-field" value="${selectedObj.name}" onchange="updateResource('${parentVnet.id}', '${selectedObj.id}', 'name', this.value)"></div>
    `;
    Object.keys(selectedObj.config).forEach(key => {
      html += `
        <div class="editor-row" style="margin-top:6px;">
          <span class="editor-label">${key.toUpperCase()}</span>
          <input type="text" class="input-field" value="${selectedObj.config[key]}" onchange="updateResourceConfig('${parentVnet.id}', '${selectedObj.id}', '${key}', this.value)">
        </div>
      `;
    });
    html += `<button class="btn danger" onclick="deleteResource('${parentVnet.id}', '${selectedObj.id}')">🗑️ Delete Resource</button>`;
  }

  html += `</div>`;
  container.innerHTML = html;
}

// ============================================================
// STATE MUTATIONS & PERSISTENCE
// ============================================================
const colors = ['#00BCF2', '#00B294', '#FF8C00', '#8764B8', '#E81123', '#107C10'];

function saveState() {
  localStorage.setItem(SAVED_STATE_KEY, JSON.stringify(state));
}

function fullUpdate() {
  saveState(); // Save to localStorage on every major update
  renderSidebar();
  renderEditor();
  draw();
}

function resetDiagram() {
  if (confirm('Are you sure you want to delete all your changes and reset to the default diagram?')) {
    localStorage.removeItem(SAVED_STATE_KEY);
    location.reload();
  }
}

function addSpoke() {
  state.spokes.push({
    id: getUid(),
    name: `Spoke ${state.spokes.length + 1}`,
    cidr: `10.${state.spokes.length + 1}.0.0/16`,
    color: colors[state.spokes.length % colors.length],
    resources: []
  });
  fullUpdate();
}

function deleteSpoke(id) {
  state.spokes = state.spokes.filter(s => s.id !== id);
  state.selectedId = null;
  fullUpdate();
}

function updateVnet(id, key, val) {
  if (state.hub.id === id) state.hub[key] = val;
  else {
    const sp = state.spokes.find(s => s.id === id);
    if (sp) sp[key] = val;
  }
  fullUpdate();
}

function toggleDropdown(id) {
  document.querySelectorAll('.res-dropdown').forEach(d => d.classList.remove('show'));
  document.getElementById(`dropdown-${id}`).classList.toggle('show');
}

function addResource(vnetId, resType) {
  const vnet = state.hub.id === vnetId ? state.hub : state.spokes.find(s => s.id === vnetId);
  const rT = RES_TYPES[resType];
  const newRes = { id: getUid(), type: resType, name: `New ${rT.label}`, config: { ...rT.config } };
  vnet.resources.push(newRes);
  document.querySelectorAll('.res-dropdown').forEach(d => d.classList.remove('show'));
  selectNode(newRes.id);
}

function deleteResource(vnetId, resId) {
  const vnet = state.hub.id === vnetId ? state.hub : state.spokes.find(s => s.id === vnetId);
  vnet.resources = vnet.resources.filter(r => r.id !== resId);
  state.selectedId = null;
  fullUpdate();
}

function updateResource(vnetId, resId, key, val) {
  const vnet = state.hub.id === vnetId ? state.hub : state.spokes.find(s => s.id === vnetId);
  const res = vnet.resources.find(r => r.id === resId);
  res[key] = val;
  fullUpdate();
}

function updateResourceConfig(vnetId, resId, configKey, val) {
  const vnet = state.hub.id === vnetId ? state.hub : state.spokes.find(s => s.id === vnetId);
  const res = vnet.resources.find(r => r.id === resId);
  res.config[configKey] = val;
  saveState(); // Save state even for minor text edits
  renderEditor(); 
}

function selectNode(id) {
  state.selectedId = id;
  fullUpdate();
}

// ============================================================
// EXPORT DIAGRAM (ΑΚΡΙΒΩΣ ΟΠΩΣ ΤΟ ΒΛΕΠΕΙΣ)
// ============================================================
function exportDiagram() {
  const expCanvas = document.createElement('canvas');
  expCanvas.width = canvas.width * 2;
  expCanvas.height = canvas.height * 2;
  const ec = expCanvas.getContext('2d');
  
  ec.scale(2, 2);
  
  // Βάφουμε το φόντο
  ec.fillStyle = '#060D18';
  ec.fillRect(0, 0, canvas.width, canvas.height);
  
  // Ζωγραφίζουμε το πλέγμα
  ec.strokeStyle = 'rgba(0,120,212,0.04)';
  ec.lineWidth = 1;
  for(let x = 0; x < canvas.width; x += 40) { 
    ec.beginPath(); ec.moveTo(x, 0); ec.lineTo(x, canvas.height); ec.stroke(); 
  }
  for(let y = 0; y < canvas.height; y += 40) { 
    ec.beginPath(); ec.moveTo(0, y); ec.lineTo(canvas.width, y); ec.stroke(); 
  }

  // Αντιγράφουμε τον κύριο καμβά
  ec.drawImage(canvas, 0, 0, canvas.width, canvas.height);

  // Download logic
  const link = document.createElement('a');
  link.download = `azure-diagram-${new Date().getTime()}.png`;
  link.href = expCanvas.toDataURL('image/png');
  link.click();
}

// ============================================================
// CANVAS SETUP & MATH
// ============================================================
const canvas = document.getElementById('diagram-canvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
  draw();
}
window.addEventListener('resize', resize);
setTimeout(resize, 100);

function getRenderNodes() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const r = Math.min(canvas.width, canvas.height) * 0.35;
  const nodes = [];

  nodes.push({ id: state.hub.id, isVnet: true, x: cx, y: cy, label: state.hub.name, sub: state.hub.cidr, color: state.hub.color, radius: 55 });
  
  const hResCount = state.hub.resources.length;
  state.hub.resources.forEach((res, i) => {
    const angle = (i / Math.max(hResCount, 1)) * Math.PI * 2 - Math.PI/2;
    const dist = 110;
    nodes.push({
      id: res.id, isVnet: false, parentId: state.hub.id,
      x: cx + Math.cos(angle)*dist, y: cy + Math.sin(angle)*dist,
      label: res.name, type: res.type, color: RES_TYPES[res.type] ? RES_TYPES[res.type].color : '#FFF', width: 70, height: 50
    });
  });

  const spCount = state.spokes.length;
  state.spokes.forEach((spoke, i) => {
    const angle = spCount === 1 ? Math.PI/2 : (i / spCount) * Math.PI * 2;
    const sx = cx + Math.cos(angle) * r;
    const sy = cy + Math.sin(angle) * r;
    
    nodes.push({ id: spoke.id, isVnet: true, parentId: state.hub.id, x: sx, y: sy, label: spoke.name, sub: spoke.cidr, color: spoke.color, radius: 45 });

    const sResCount = spoke.resources.length;
    const spacing = 75;
    const totalLength = (sResCount - 1) * spacing;
    const perp = { x: -Math.sin(angle), y: Math.cos(angle) };
    
    spoke.resources.forEach((res, j) => {
      const t = sResCount > 1 ? (j * spacing - totalLength / 2) : 0;
      const resR = 95;
      const rx = sx + Math.cos(angle) * resR + perp.x * t;
      const ry = sy + Math.sin(angle) * resR + perp.y * t;
      
      nodes.push({
        id: res.id, isVnet: false, parentId: spoke.id,
        x: rx, y: ry, label: res.name, type: res.type, color: RES_TYPES[res.type] ? RES_TYPES[res.type].color : '#FFF', width: 70, height: 50
      });
    });
  });

  return nodes;
}

// ============================================================
// DRAWING ENGINE
// ============================================================
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save(); ctx.translate(state.offset.x, state.offset.y); ctx.scale(state.scale, state.scale);

  const nodes = getRenderNodes();
  const map = {}; nodes.forEach(n => map[n.id] = n);

  nodes.forEach(n => {
    if (n.parentId && map[n.parentId]) {
      const p = map[n.parentId];
      ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(p.x, p.y);
      if (n.isVnet) {
        const grad = ctx.createLinearGradient(p.x, p.y, n.x, n.y);
        grad.addColorStop(0, 'rgba(0,120,212,0.5)'); grad.addColorStop(1, n.color+'80');
        ctx.strokeStyle = grad; ctx.lineWidth = 2;
      } else {
        ctx.strokeStyle = n.color+'60'; ctx.lineWidth = 1; ctx.setLineDash([3,6]);
      }
      ctx.stroke(); ctx.setLineDash([]);
    }
  });

  nodes.forEach(n => drawNode(n));
  ctx.restore();
  
  // Save position metadata (panning/zoom state) to localstorage implicitly via draw calls
  if (state.dragging) {
    saveState();
  }
}

function drawNode(n) {
  const isSelected = state.selectedId === n.id;
  ctx.save();
  if (isSelected) { ctx.shadowColor = n.color; ctx.shadowBlur = 15; }

  if (!n.isVnet) {
    const rt = RES_TYPES[n.type] || { icon: '❓' };
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(n.x - n.width/2, n.y - n.height/2, n.width, n.height, 8);
    else ctx.rect(n.x - n.width/2, n.y - n.height/2, n.width, n.height);
    
    ctx.fillStyle = n.color + '25'; ctx.fill();
    ctx.strokeStyle = isSelected ? n.color : n.color + '80'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.font = '20px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(rt.icon, n.x, n.y - 8);
    ctx.font = 'bold 9px JetBrains Mono'; ctx.fillStyle = '#FFF';
    ctx.fillText(n.label.length > 10 ? n.label.slice(0,9)+'…' : n.label, n.x, n.y + 14);

  } else {
    ctx.beginPath(); ctx.arc(n.x, n.y, n.radius, 0, Math.PI*2);
    if (n.id === 'hub') {
      const g = ctx.createRadialGradient(n.x-10, n.y-10, 0, n.x, n.y, n.radius);
      g.addColorStop(0, '#1A8FE3'); g.addColorStop(1, '#003A5C'); ctx.fillStyle = g;
    } else ctx.fillStyle = n.color + '25';
    ctx.fill();
    ctx.strokeStyle = isSelected ? n.color : n.color + '80'; ctx.lineWidth = 2; ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.font = 'bold 11px Syne'; ctx.fillStyle = n.id==='hub' ? '#E8F4FD' : n.color;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(n.label, n.x, n.y - 6);
    ctx.font = '9px JetBrains Mono'; ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(n.sub, n.x, n.y + 10);
  }
  ctx.restore();
}

// ============================================================
// CANVAS INTERACTIONS (PAN & ZOOM)
// ============================================================
canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left - state.offset.x) / state.scale;
  const py = (e.clientY - rect.top - state.offset.y) / state.scale;
  
  const nodes = getRenderNodes();
  let hit = null;
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (!n.isVnet && Math.abs(px - n.x) < n.width/2 && Math.abs(py - n.y) < n.height/2) hit = n;
    else if (n.isVnet && Math.sqrt((px-n.x)**2 + (py-n.y)**2) < n.radius) hit = n;
    if (hit) break;
  }

  if (hit) { selectNode(hit.id); }
  else {
    state.selectedId = null; fullUpdate();
    state.dragging = true; state.dragStart = {x: e.clientX, y: e.clientY};
    state.offsetStart = {...state.offset};
    canvas.style.cursor = 'grabbing';
  }
});

canvas.addEventListener('mousemove', e => {
  if (!state.dragging) return;
  state.offset.x = state.offsetStart.x + (e.clientX - state.dragStart.x);
  state.offset.y = state.offsetStart.y + (e.clientY - state.dragStart.y);
  draw();
});

canvas.addEventListener('mouseup', () => { 
  if(state.dragging) {
    state.dragging = false; 
    saveState(); // Save final pan position
  }
  canvas.style.cursor = 'grab'; 
});

canvas.addEventListener('mouseleave', () => { 
  if(state.dragging) {
    state.dragging = false; 
    saveState();
  }
  canvas.style.cursor = 'grab'; 
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  state.scale = Math.max(0.3, Math.min(2.5, state.scale * factor));
  saveState(); // Save zoom state
  draw();
}, { passive: false });

// INIT
fullUpdate();

</script>
</body>
</html>
